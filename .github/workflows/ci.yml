# Every push and pull request: the tests on Python 3.9 and 3.13, AppInspect, and the package as an
# artifact. A v* tag also publishes the package as a GitHub release (docs/releasing.md).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install AppInspect
        # python-magic, one of its dependencies, needs libmagic; lxml<6 has wheels up to Python 3.13
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libmagic1
          uv tool install --python 3.13 splunk-appinspect
      - name: Build, test and inspect
        # --keep-build: the package carries the version and build that were committed.
        # build.sh skips AppInspect when it is not installed; here a missing report fails the job.
        run: |
          ./scripts/build.sh --keep-build --appinspect
          test -s dist/appinspect-jev_for_splunk.json
      - uses: actions/upload-artifact@v7
        with:
          name: jev_for_splunk
          if-no-files-found: error
          path: |
            dist/jev_for_splunk.tar.gz
            dist/appinspect-jev_for_splunk.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: jev_for_splunk
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = //p' jev_for_splunk/default/app.conf | head -1)"
          build="$(sed -n 's/^build = //p' jev_for_splunk/default/app.conf | head -1)"
          if [ "v$version" != "$TAG" ]; then echo "tag $TAG does not match app.conf version $version"; exit 1; fi
          cp dist/jev_for_splunk.tar.gz "dist/jev_for_splunk-$version.tar.gz"
          python3 scripts/release_notes.py "dist/jev_for_splunk-$version.tar.gz" dist/appinspect-jev_for_splunk.json > notes.md
          gh release create "$TAG" "dist/jev_for_splunk-$version.tar.gz" \
            --title "Jev for Splunk $version (build $build)" --notes-file notes.md
