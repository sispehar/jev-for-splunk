[id]
name = jev_for_splunk
version = 0.1.1

[install]
is_configured = false
build = 13

[ui]
is_visible = true
label = Jev for Splunk
show_in_nav = true
setup_view = jev_setup

[launcher]
author = simon.spehar@flint.si
description = Ask TypeSafe Jev typed questions about any events from SPL: | jev noul|choice|score returns calibrated probabilities, options and levels as fields, cached per question in the KV store.
version = 0.1.1

[package]
id = jev_for_splunk
# Never true: this app ships from GitHub, and the Splunkbase app with this id is a different app, whose
# releases Splunk would otherwise offer in Manage Apps as updates to this one.
check_for_updates = false

[triggers]
reload.jev = simple
reload.logging = simple
