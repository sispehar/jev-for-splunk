description = Ask TypeSafe Jev typed questions about any events from SPL: | jev noul|choice|score returns calibrated probabilities, options and levels as fields, cached per question in the KV store.
version = 0.1.0

[package]
id = jev_for_splunk
check_for_updates = false

[triggers]
reload.jev = simple
reload.logging = simple
