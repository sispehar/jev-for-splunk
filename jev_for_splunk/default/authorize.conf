# use_jev lets a user run | jev without list_storage_passwords: the command gets the TypeSafe key
# from this app's endpoint (restmap.conf), which serves that key and no other secret.
[capability::use_jev]

[role_admin]
use_jev = enabled

# Give this role, next to their own, to the people who run | jev or view dashboards that use it.
# default.meta lets it read and write the judgment cache.
[role_jev_user]
use_jev = enabled
