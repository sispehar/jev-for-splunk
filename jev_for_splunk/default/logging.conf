# Python logging configuration picked up by splunklib.searchcommands.
# Everything lands in $SPLUNK_HOME/var/log/splunk/jev.log, which Splunk indexes
# into _internal: search index=_internal source=*jev.log
[loggers]
keys = root, JevCommand, JevTestCommand, splunklib

[logger_root]
level = WARNING
handlers = app

[logger_JevCommand]
qualname = JevCommand
level = INFO
handlers = app
propagate = 0

[logger_JevTestCommand]
qualname = JevTestCommand
level = INFO
handlers = app
propagate = 0

[logger_splunklib]
qualname = splunklib
level = WARNING
handlers = app
propagate = 0

[handlers]
keys = app

[handler_app]
class = logging.handlers.RotatingFileHandler
level = NOTSET
args = ('%(SPLUNK_HOME)s/var/log/splunk/jev.log', 'a', 5242880, 5, 'utf-8')
formatter = kv

[formatters]
keys = kv

[formatter_kv]
format = %(asctime)s level=%(levelname)s logger=%(name)s pid=%(process)d %(message)s
