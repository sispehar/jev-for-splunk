# Jev for Splunk macros. Override any of them in local/macros.conf.

# Estimated USD for t input tokens at the published Jev price ($0.042 per million
# input tokens; output tokens are free).
[jev_cost_usd(1)]
args = t
definition = round($t$*0.042/1000000, 6)
iseval = 0

# Input tokens this search actually paid for one primitive alias a: the price tag
# of an answer (<a>_tokens) counts only where <a>_cached is 0.
#   ... | jev noul message "..." as oc | stats sum(eval(`jev_paid(oc)`)) AS tokens
[jev_paid(1)]
args = a
definition = if('$a$_cached'==0, '$a$_tokens', 0)
iseval = 0

# The command's own log (summary lines carry answers, cache hits, requests, tokens, cost).
[jev_internal_log]
definition = index=_internal source=*jev.log
iseval = 0
