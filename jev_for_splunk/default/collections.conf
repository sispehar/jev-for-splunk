# The judgment cache: one document per (model, state, question). The document
# key is sha256 over the requested model, the canonical state and the canonical
# question, so a battery question and a | jev noul|choice|score call with the
# same wording share an entry. No event text is stored, only the answer.
[jev_cache]
field.model = string
field.resolved_model = string
field.qtype = string
field.qhash = string
field.question = string
field.answer = string
field.input_tokens = number
field.request_tokens = number
field.request_questions = number
field.latency_ms = number
field.created = number
field.schema = number
accelerated_fields.created = {"created": 1}
accelerated_fields.qhash = {"qhash": 1}
replicate = false
