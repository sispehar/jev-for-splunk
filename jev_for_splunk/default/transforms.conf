# Read the judgment cache from SPL, e.g. for cost and hit-rate panels:
#   | inputlookup jev_cache_lookup | stats count sum(input_tokens) BY qtype resolved_model
[jev_cache_lookup]
external_type = kvstore
collection = jev_cache
fields_list = _key, model, resolved_model, qtype, qhash, question, answer, input_tokens, request_tokens, request_questions, latency_ms, created, schema
