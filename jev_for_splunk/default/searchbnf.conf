[jev-command]
syntax = jev (<jev-primitive>)? (battery=<string>)? (questions=<string>)? (state=<string>)? (prefix=<string>)? (model=<string>)? (threads=<int>)? (rps=<int>)? (timeout=<int>)? (maxevents=<int>)? (maxstate=<int>)? (probs=<bool>)? (cache=(kv|memo|refresh|off))? (dryrun=<bool>)? (meta=(basic|full))? (keepstate=<bool>)?
shortdesc = Ask TypeSafe Jev a typed question about every event: a probability (noul), an option (choice) or a level (score).
description = Primitive form: "jev noul|choice|score <field> \"<question>\" as <name>" asks one question per event and adds <name> (the probability, the chosen option or the expected level) plus <name>_confidence, <name>_level, <name>_label where they apply, and <name>_error, <name>_cached, <name>_tokens, <name>_model. choice needs options= ("a: description; b: description" or lookup:<name> with columns option,description); score needs levels= ("lowest; ...; highest" or lookup:<name> with a level column); noul accepts criteria_true= and criteria_false=. Battery form: battery=<[app:]id> asks every question of a battery file in one request per event, questions= adds or overrides questions inline as JSON and state= maps state keys to fields. Answers are cached per (model, state, question) in the KV store collection jev_cache (cache=kv); cache=refresh re-judges and overwrites, cache=memo reuses only within the search, cache=off never reuses. dryrun=true estimates tokens and cost without calling the API. Running the command requires the list_storage_passwords capability because the API key is read from storage/passwords. Do not use backticks inside a question: Splunk expands them as macros.
usage = public
example1 = sourcetype=shop:message | jev noul message "The customer says they were charged more than they should have been" as overcharged | timechart span=15m sum(overcharged)
comment1 = Noul as a metric: the sum of calibrated probabilities is the expected number of matching messages.
example2 = sourcetype=shop:message | jev choice message "Which part of the shop is this message about?" options=lookup:shop_areas as area | stats count BY area
comment2 = Choice as a join key: the answer is one of your own option names.
example3 = sourcetype=shop:message | jev score message "How upset is the customer?" levels="Calm question; Annoyed; Angry" as upset | sort - upset
comment3 = Score as a ranking: the expected level is a number you can sort, bin and weight.
example4 = sourcetype=shop:message | jev battery=shop_messages dryrun=true | stats sum(jev_input_tokens) AS tokens
comment4 = Preview the cost of judging a window before running it.
example5 = | makeresults | eval text="Help, payouts are failing for 3 days!" | jev state="text=text" questions="{\"urgent\":{\"type\":\"noul\",\"instructions\":\"Does `text` convey urgency?\"}}"
comment5 = Ad-hoc question in full form without a battery file.
related = jevtest
tags = jev typesafe noul choice score judgment ai

[jev-primitive]
syntax = (noul|choice|score) (<field-list>)? <string> (options=<string>)? (levels=<string>)? (criteria_true=<string>)? (criteria_false=<string>)? (as <field>)?
description = One typed question. Without a field list the question reads _raw.

[jevtest-command]
syntax = jevtest (live=<bool>)?
shortdesc = Self-test for the Jev for Splunk app: Python, SDK, configuration, batteries, API key, connectivity, the KV cache and which app owns | jev.
description = Generates one row per check with the fields check, status (ok, warn, fail) and detail. live=true additionally sends one tiny judgment to the API and reports the model that answered, the tokens used and the latency.
usage = public
example1 = | jevtest live=true
comment1 = Full connectivity test including one paid request (a fraction of a cent).
related = jev
tags = jev typesafe
