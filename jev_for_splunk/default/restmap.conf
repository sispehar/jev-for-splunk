# The TypeSafe key for | jev, for users who hold use_jev but not list_storage_passwords.
# splunkd checks the capability; the handler reads the key with a system token (bin/jev_key.py).
[script:jev_key]
match = /jev_for_splunk/key
script = jev_key.py
scripttype = persist
handler = jev_key.KeyHandler
requireAuthentication = true
capability = use_jev
passSystemAuth = true
output_modes = json
python.version = python3
python.required = 3.9, 3.13
