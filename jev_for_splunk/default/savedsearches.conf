# Deletes cached answers older than ttl_days (jev.conf [cache]) every night. It sends nothing to
# TypeSafe; ttl_days = 0 makes it a no-op. Disable it in local/savedsearches.conf to keep old answers.
[jev_purge_expired]
search = | jevpurge
description = Deletes cached | jev answers older than ttl_days from the jev_cache collection. Sends nothing to TypeSafe.
cron_schedule = 23 3 * * *
enableSched = 1
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
