# Jev for Splunk - runtime settings. Override any key in local/jev.conf.
# An app that runs | jev can also ship its own default/jev.conf (for example to
# pin a model version); the search's app is layered on top of this one.
# Documentation: README/jev.conf.spec

[api]
endpoint = https://api.typesafe.ai/v1
model = jev-latest
timeout = 30
max_retries = 5
requests_per_second = 15
proxy_url =
ca_bundle =

[defaults]
threads = 8
prefix = jev_
maxevents = 5000
maxstate = 16000
probs = false

[cache]
mode = kv
collection = jev_cache
ttl_days = 90
batch_size = 1000

[storage]
realm = jev_for_splunk
username = typesafe_api_key
